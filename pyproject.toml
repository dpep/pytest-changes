[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "pytest-changes"
dynamic = ["version"]
description = "assert that a block of code changes a value"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Daniel Pepper" }]
requires-python = ">= 3.11"
dependencies = ["pytest >= 8.4"]
classifiers = [
  # https://pypi.org/classifiers/
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dpep/pytest-changes"
Issues = "https://github.com/dpep/pytest-changes/issues"
Changelog = "https://github.com/dpep/pytest-changes/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
changes = "pytest_changes._plugin"

[dependency-groups]
dev = [
  "hypothesis",
  "pytest >= 8.2",
  "ruff",
]

[tool.hatch.version]
path = "src/pytest_changes/__init__.py"

# Allowlist so untracked local files never ship.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md", "LICENSE.txt", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
xfail_strict = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
